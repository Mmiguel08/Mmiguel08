opacity=".4"/><text x="625" y="169" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10.5" fill="#E6EDF3">Mar 2024 – Aug 2024</text><text x="70" y="209" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA7B4">MPLS projects (VPLS, VPWS, VPRN) on Nokia; Juniper EX2300 / EX4400 and Cisco configuration.</text><text x="70" y="226" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA7B4">Lab validation of BGP and SIP-Trunk voice solutions before network rollout.</text><circle cx="44" cy="258" r="7" fill="#070B10" stroke="#38BDF8" stroke-width="2"/><circle cx="44" cy="258" r="3" fill="#38BDF8" filter="url(#neon)"/><text x="70" y="263" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6EDF3">Network Analyst</text><text x="70" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#38BDF8">iPworld · Luanda</text><rect x="554" y="248" width="142" height="22" rx="11" fill="#38BDF8" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".4"/><text x="625" y="263" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10.5" fill="#E6EDF3">Mar 2022 – Feb 2024</text><text x="70" y="303" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA7B4">Radio access network analysis and implementation of radio transmission projects.</text><text x="70" y="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA7B4">Cisco and Mikrotik routers; Cambium, Ubiquiti, and WiltelCOM radio devices.</text>
