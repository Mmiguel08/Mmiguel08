name: CI

on:
  push:
    paths: ["src/**", "tests/**", "profile.toml", "pyproject.toml"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
